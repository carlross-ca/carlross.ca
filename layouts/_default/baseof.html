<!doctype html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify | default .Site.Params.description }}{{ end }}">
  {{ with .OutputFormats.Get "RSS" }}<link rel="alternate" type="application/rss+xml" href="{{ .RelPermalink }}" title="{{ $.Site.Title }}">{{ end }}
  {{ partial "extend_head.html" . }}
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">{{ .Site.Title }}</a>
    <nav class="nav" aria-label="Main navigation">
      {{ range .Site.Menus.main }}<a href="{{ .URL }}"{{ with .Params.target }} target="{{ . }}"{{ end }}{{ with .Params.rel }} rel="{{ . }}"{{ end }}>{{ .Name }}</a>{{ end }}
    </nav>
  </header>
  <main class="site-main{{ if .IsHome }} home-main{{ end }}">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
