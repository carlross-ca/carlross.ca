{{ define "main" }}
<section class="article-head">
  <p class="eyebrow">{{ .Section | default "Archive" }}</p>
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div class="content intro">{{ . }}</div>{{ end }}
</section>
<div class="list">
  {{ range .Pages }}
  <a class="list-row" href="{{ .RelPermalink }}">
    <span>
      <strong>{{ .Title }}</strong>
      <em>{{ .Summary | plainify }}</em>
    </span>
    <time>{{ .Date.Format "2006-01-02" }}</time>
  </a>
  {{ end }}
</div>
{{ end }}
