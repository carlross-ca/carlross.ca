baseURL = "https://carlross.ca/"
languageCode = "en-ca"
title = "Carl Ross"
enableRobotsTXT = true
enableEmoji = false
buildFuture = true
summaryLength = 30
pagination.pagerSize = 20

[params]
  author = "Carl Ross"
  description = "A verifiable public record testing whether active trading is worthwhile against the S&P 500 Total Return Index."
  defaultTheme = "light"
  hideFooter = false

[menu]
  [[menu.main]]
    identifier = "performance"
    name = "Performance"
    url = "/performance/"
    weight = 10
  [[menu.main]]
    identifier = "notes"
    name = "Notes"
    url = "/notes/"
    weight = 20
  [[menu.main]]
    identifier = "videos"
    name = "Videos"
    url = "https://www.youtube.com/@carlross-ca"
    weight = 25
    [menu.main.params]
      target = "_blank"
      rel = "noopener noreferrer"
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 40
  [[menu.main]]
    identifier = "portfolio-reporting"
    name = "Offer"
    url = "/portfolio-reporting/"
    weight = 30
  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "/contact/"
    weight = 50

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[markup.goldmark.renderer]
  unsafe = false

[markup.highlight]
  noClasses = false
  codeFences = false

[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    disable = true
  [privacy.youtube]
    disable = true
