baseURL = "https://carlross.ca/"
languageCode = "en-ca"
title = "Carl Ross Investing Journal"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = false
buildFuture = true
summaryLength = 30
pagination.pagerSize = 20

[params]
  author = "Carl Ross"
  description = "A personal investing journal about ETFs, options, process, risk, mistakes, and results."
  defaultTheme = "light"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = false
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  DisableScrollToTop = true
  hideFooter = false
  disableSpecial1stPost = true
  assets.disableFingerprinting = false
  assets.disableHLJS = true

  [params.homeInfoParams]
    Title = ""
    Content = """
I document a personal portfolio using ETFs and options, with monthly notes on process, risk, mistakes, and results.

This is a personal investing journal, not investment advice or an offer to manage money.
"""

[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 10
  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "/contact/"
    weight = 20

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[markup.goldmark.renderer]
  unsafe = false

[markup.highlight]
  noClasses = false
  codeFences = false

[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    disable = true
  [privacy.youtube]
    disable = true
